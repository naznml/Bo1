let currentVariant=0;function letters(i){return String.fromCharCode(65+i)}function arraysEqual(a,b){if(a.length!==b.length)return false;const x=[...a].sort((m,n)=>m-n);const y=[...b].sort((m,n)=>m-n);return x.every((v,i)=>v===y[i])}function renderVariantCards(){document.getElementById('variantGrid').innerHTML=tests.map((t,i)=>`<button class="variant-card ${i===currentVariant?'active':''}" onclick="selectVariant(${i})"><span>${i+1}</span><h2>${t.title}</h2><p>20 сұрақ</p></button>`).join('')}function renderTest(){const t=tests[currentVariant];document.getElementById('testArea').innerHTML=`<div class="test-panel active"><div class="test-header"><div><h2>${t.title}</h2><p>${t.code}</p></div><div class="badge">20 сұрақ</div></div>${t.questions.map((q,qi)=>`<div class="question" data-question="${qi}"><div class="question-title">${qi+1}. ${q.text}<br><span class="multi-note">${q.answer.length>1?'Бірнеше дұрыс жауап бар':'Бір дұрыс жауап'}</span></div><div class="options">${q.options.map((o,oi)=>`<label class="option" data-option="${oi}"><input type="checkbox" value="${oi}"><span>${letters(oi)}) ${o}</span></label>`).join('')}</div><div class="answer-box"><p><strong>Дұрыс жауап:</strong> ${q.answer.map(i=>`${letters(i)}) ${q.options[i]}`).join('; ')}</p><p><strong>Түсіндірме:</strong> ${q.explanation}</p></div></div>`).join('')}<div class="actions"><button class="btn btn-primary" onclick="showResult()">Нәтижені көрсету</button><button class="btn btn-secondary" onclick="resetTest()">Қайта тапсыру</button></div><div class="result-box" id="resultBox"></div></div>`}function selectVariant(i){currentVariant=i;renderVariantCards();renderTest();window.scrollTo({top:0,behavior:'smooth'})}function showResult(){const t=tests[currentVariant];let score=0;t.questions.forEach((q,qi)=>{const el=document.querySelector(`.question[data-question="${qi}"]`);const selected=[...el.querySelectorAll('input:checked')].map(input=>Number(input.value));const opts=el.querySelectorAll('.option');opts.forEach(o=>o.classList.remove('correct','wrong'));q.answer.forEach(i=>opts[i].classList.add('correct'));selected.forEach(i=>{if(!q.answer.includes(i))opts[i].classList.add('wrong')});if(arraysEqual(selected,q.answer))score++;el.querySelector('.answer-box').classList.add('show')});const r=document.getElementById('resultBox');r.classList.add('show');r.textContent=`Сіздің нәтижеңіз: ${score}/${t.questions.length}`;r.scrollIntoView({behavior:'smooth',block:'center'})}function resetTest(){document.querySelectorAll('input').forEach(i=>i.checked=false);document.querySelectorAll('.option').forEach(o=>o.classList.remove('correct','wrong'));document.querySelectorAll('.answer-box').forEach(b=>b.classList.remove('show'));const r=document.getElementById('resultBox');r.classList.remove('show');r.textContent='';window.scrollTo({top:0,behavior:'smooth'})}renderVariantCards();renderTest();
